  <title>BusinessOS | Workspace</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #081426;
      --panel: #0B1730;
      --panel-2: #101f3a;
      --panel-3: #132642;
      --blue: #2F6BFF;
      --blue-hover: #477cff;
      --soft-blue: #DCE7FF;
      --text: #F5F7FB;
      --muted: #9aabc4;
      --muted-2: #71839e;
      --border: #23334D;
      --success: #31c48d;
      --warning: #e5b65c;
      --danger: #ef7777;
      --shadow: 0 18px 48px rgba(0, 0, 0, .24);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid #8db1ff;
      outline-offset: 3px;
    }
    .app-shell {
      display: grid;
      grid-template-columns: 258px minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }
    .sidebar {
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      padding: calc(18px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));
      background: linear-gradient(180deg, #0b1730 0%, #09162b 100%);
      border-right: 1px solid var(--border);
    }
    .brand-row { display: flex; align-items: center; gap: 11px; padding: 3px 9px 22px; }
    .brand-logo {
      width: 43px; height: 43px; flex: 0 0 43px; object-fit: cover;
      border-radius: 13px; background: #10213c; border: 1px solid rgba(255,255,255,.1);
    }
    .brand-name { font-size: 17px; font-weight: 780; letter-spacing: -.5px; line-height: 1.05; }
    .brand-tag { margin-top: 5px; color: var(--muted); font-size: 10px; letter-spacing: 1.15px; text-transform: uppercase; }
    .side-caption {
      padding: 10px 11px 8px; color: #71839e; font-size: 10px; font-weight: 750;
      letter-spacing: 1.25px; text-transform: uppercase;
    }
    .side-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0 2px 10px; scrollbar-width: thin; scrollbar-color: #304665 transparent; }
    .nav-button {
      display: flex; width: 100%; align-items: center; gap: 11px; margin: 3px 0; padding: 10px 11px;
      border: 1px solid transparent; border-radius: 11px; background: transparent; color: #aebbd0;
      text-align: left; cursor: pointer; transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .nav-button:hover { background: rgba(255,255,255,.045); color: var(--text); }
    .nav-button.active { color: #fff; background: rgba(47,107,255,.17); border-color: rgba(84,135,255,.27); }
    .nav-icon { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px; background: rgba(255,255,255,.055); color: #b9caff; font-size: 16px; }
    .nav-button.active .nav-icon { background: var(--blue); color: white; }
    .nav-label { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 630; }
    .nav-count { color: #7285a3; font-size: 10px; font-weight: 700; }
    .sidebar-footer { border-top: 1px solid var(--border); padding: 13px 5px 0; }
    .footer-note { display: flex; align-items: center; gap: 8px; color: #8395af; font-size: 10.5px; line-height: 1.45; padding: 7px 8px; }
    .online-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px rgba(49,196,141,.1); }

    .workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
    .topbar {
      position: relative; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 76px; padding: calc(13px + var(--safe-top)) clamp(16px, 3vw, 34px) 13px;
      background: rgba(8,20,38,.94); border-bottom: 1px solid var(--border); backdrop-filter: blur(18px);
    }
    .top-left { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .mobile-menu {
      display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--border);
      border-radius: 12px; background: var(--panel); cursor: pointer; font-size: 19px;
    }
    .page-context { min-width: 0; }
    .context-kicker { margin-bottom: 3px; color: var(--muted-2); font-size: 10px; letter-spacing: 1.15px; text-transform: uppercase; font-weight: 750; }
    .context-title { overflow: hidden; font-size: 17px; font-weight: 750; letter-spacing: -.35px; text-overflow: ellipsis; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 11px; }
    .search-wrap { position: relative; width: min(32vw, 310px); }
    .search-box {
      width: 100%; height: 41px; padding: 0 13px 0 39px; border: 1px solid var(--border); border-radius: 12px;
      background: #0d1a31; color: var(--text); outline: none; font-size: 12px;
    }
    .search-box::placeholder { color: #7385a0; }
    .search-box:focus { border-color: rgba(91,142,255,.8); box-shadow: 0 0 0 3px rgba(47,107,255,.12); }
    .search-icon { position: absolute; left: 14px; top: 10px; color: #7f91ad; font-size: 16px; pointer-events: none; }
    .search-results {
      display: none; position: absolute; top: calc(100% + 9px); right: 0; width: min(390px, 88vw); max-height: 360px;
      overflow: auto; padding: 8px; border: 1px solid var(--border); border-radius: 14px; background: #0d1a31; box-shadow: var(--shadow);
    }
    .search-results.open { display: block; }
    .search-result {
      display: flex; width: 100%; align-items: flex-start; gap: 10px; padding: 10px; border: 0; border-radius: 9px;
      background: transparent; text-align: left; cursor: pointer;
    }
    .search-result:hover { background: rgba(255,255,255,.06); }
    .result-number { color: #8eafff; font-size: 10px; font-weight: 800; padding-top: 2px; }
    .result-name { display: block; color: var(--text); font-size: 12px; font-weight: 680; }
    .result-group { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .icon-button { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: #cad5e7; cursor: pointer; font-size: 17px; }
    .icon-button:hover { border-color: #3d5e92; background: var(--panel-2); }
    .profile-wrap { position: relative; }
    .profile-button { display: flex; align-items: center; gap: 9px; padding: 3px 5px 3px 9px; border: 1px solid transparent; border-radius: 13px; background: transparent; cursor: pointer; }
    .profile-button:hover, .profile-button[aria-expanded="true"] { background: var(--panel); border-color: var(--border); }
    .profile-meta { max-width: 130px; text-align: right; }
    .profile-name { display: block; max-width: 130px; overflow: hidden; color: var(--text); font-size: 11.5px; font-weight: 730; text-overflow: ellipsis; white-space: nowrap; }
    .profile-role { display: block; margin-top: 3px; color: var(--muted); font-size: 9.5px; }
    .avatar { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; overflow: hidden; border: 1px solid rgba(133,169,255,.42); border-radius: 12px; background: linear-gradient(145deg,#2f6bff,#18366b); color: white; font-size: 13px; font-weight: 800; }
    .avatar img { display: none; width: 100%; height: 100%; object-fit: cover; }
    .profile-menu {
      display: none; position: absolute; top: calc(100% + 9px); right: 0; width: 220px; padding: 8px;
      border: 1px solid var(--border); border-radius: 14px; background: #0d1a31; box-shadow: var(--shadow);
    }
    .profile-menu.open { display: block; }
    .profile-menu-head { padding: 10px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
    .profile-menu-head strong { display: block; font-size: 12px; }
    .profile-menu-head span { display: block; margin-top: 4px; overflow-wrap: anywhere; color: var(--muted); font-size: 10px; }
    .profile-menu button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: transparent; color: #c5d1e3; text-align: left; font-size: 11.5px; cursor: pointer; }
    .profile-menu button:hover { background: rgba(255,255,255,.06); }
    .profile-menu button.danger { color: #ff9999; }

    .main-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 27px clamp(16px, 3vw, 36px) calc(32px + var(--safe-bottom)); scrollbar-width: thin; scrollbar-color: #304665 transparent; }
    .content-width { width: 100%; max-width: 1380px; margin: 0 auto; }
    .welcome-panel {
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 22px;
      min-height: 190px; padding: clamp(22px, 4vw, 36px); border: 1px solid rgba(89,133,211,.25); border-radius: 22px;
      background: radial-gradient(circle at 88% 25%, rgba(47,107,255,.27), transparent 31%), linear-gradient(115deg,#102342 0%,#0d1b34 68%,#10274b 100%);
      box-shadow: 0 14px 35px rgba(0,0,0,.12);
    }
    .welcome-panel::after { content: ""; position: absolute; right: 9%; bottom: -110px; width: 245px; height: 245px; border: 1px solid rgba(150,183,255,.12); border-radius: 50%; box-shadow: 0 0 0 24px rgba(150,183,255,.025), 0 0 0 50px rgba(150,183,255,.02); pointer-events: none; }
    .welcome-copy { position: relative; z-index: 1; max-width: 630px; }
    .eyebrow { color: #9db9ff; font-size: 10px; font-weight: 800; letter-spacing: 1.35px; text-transform: uppercase; }
    .welcome-title { margin: 10px 0 8px; font-size: clamp(25px, 3vw, 36px); line-height: 1.12; letter-spacing: -1.1px; font-weight: 790; }
    .welcome-description { max-width: 570px; margin: 0; color: #aebdd2; font-size: 12.5px; line-height: 1.7; }
    .welcome-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    .primary-button, .secondary-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px;
      border: 1px solid transparent; border-radius: 11px; font-size: 11.5px; font-weight: 730; cursor: pointer; transition: .18s ease;
    }
    .primary-button { background: var(--blue); color: white; box-shadow: 0 7px 18px rgba(47,107,255,.2); }
    .primary-button:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .secondary-button { background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.12); color: #e1e9f6; }
    .secondary-button:hover { background: rgba(255,255,255,.1); }
    .welcome-mark { position: relative; z-index: 1; display: grid; width: 112px; height: 112px; flex: 0 0 112px; place-items: center; margin-right: 2.5%; border: 1px solid rgba(175,200,255,.22); border-radius: 30px; background: rgba(9,25,50,.55); box-shadow: 0 18px 40px rgba(0,0,0,.18); }
    .welcome-mark img { width: 78px; height: 78px; border-radius: 19px; object-fit: cover; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 28px 0 14px; }
    .section-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.35px; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .section-link { padding: 6px 0; border: 0; background: transparent; color: #9db9ff; font-size: 10.5px; font-weight: 700; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 13px; margin-top: 17px; }
    .stat-card { display: flex; align-items: center; gap: 13px; min-height: 78px; padding: 15px; border: 1px solid var(--border); border-radius: 15px; background: rgba(13,28,51,.78); }
    .stat-icon { display: grid; width: 39px; height: 39px; flex: 0 0 39px; place-items: center; border-radius: 12px; background: rgba(47,107,255,.14); color: #a7c0ff; font-size: 18px; }
    .stat-value { display: block; font-size: 18px; font-weight: 790; letter-spacing: -.5px; }
    .stat-label { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .module-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 13px; }
    .module-card {
      display: flex; min-width: 0; align-items: flex-start; gap: 13px; padding: 16px; border: 1px solid var(--border);
      border-radius: 15px; background: linear-gradient(145deg,rgba(16,33,58,.94),rgba(11,25,46,.94)); text-align: left; cursor: pointer;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .module-card:hover { transform: translateY(-2px); border-color: #3b5e94; background: #102342; }
    .module-card .module-icon { display: grid; width: 39px; height: 39px; flex: 0 0 39px; place-items: center; border: 1px solid rgba(126,165,255,.15); border-radius: 12px; background: rgba(47,107,255,.13); color: #a9c1ff; font-size: 17px; }
    .module-card-copy { min-width: 0; flex: 1; }
    .module-card-title { display: block; color: #eef3fc; font-size: 12px; font-weight: 740; }
    .module-card-desc { display: block; margin-top: 5px; color: var(--muted); font-size: 10.5px; line-height: 1.5; }
    .module-card-meta { display: flex; align-items: center; gap: 7px; margin-top: 9px; color: #8295b1; font-size: 9px; }
    .module-card-meta b { color: #a8c0ff; font-weight: 750; }
    .arrow { margin-left: auto; color: #8296b8; font-size: 14px; }
    .lower-grid { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(220px,.8fr); gap: 13px; margin-top: 15px; }
    .surface-card { min-width: 0; padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: rgba(13,28,51,.72); }
    .surface-card h3 { margin: 0; font-size: 13px; }
    .surface-card > p { margin: 6px 0 13px; color: var(--muted); font-size: 10.5px; line-height: 1.55; }
    .quick-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .quick-button { display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid rgba(124,151,193,.14); border-radius: 10px; background: rgba(255,255,255,.025); color: #c8d4e7; text-align: left; font-size: 10.5px; cursor: pointer; }
    .quick-button:hover { background: rgba(47,107,255,.1); border-color: rgba(95,143,255,.3); }
    .quick-button span:first-child { color: #9db9ff; font-size: 14px; }
    .integrity-line { display: flex; align-items: flex-start; gap: 9px; padding: 10px 0; border-top: 1px solid rgba(124,151,193,.12); color: #aab9ce; font-size: 10px; line-height: 1.55; }
    .integrity-line:first-of-type { border-top: 0; }
    .integrity-check { color: var(--success); font-size: 13px; }

    .group-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin: 4px 0 19px; }
    .group-header h1 { margin: 8px 0 6px; font-size: clamp(23px,3vw,31px); letter-spacing: -.9px; }
    .group-header p { max-width: 710px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .group-count { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); color: #c3d1e5; font-size: 10px; white-space: nowrap; }
    .group-count strong { color: #a9c2ff; font-size: 15px; }
    .feature-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; }
    .feature-card {
      display: flex; min-width: 0; align-items: flex-start; gap: 12px; padding: 15px; border: 1px solid var(--border);
      border-radius: 14px; background: rgba(13,28,51,.76); text-align: left; cursor: pointer; transition: .18s ease;
    }
    .feature-card:hover { transform: translateY(-1px); border-color: #3b5e94; background: #10213b; }
    .feature-number { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border-radius: 10px; background: rgba(47,107,255,.13); color: #a9c1ff; font-size: 10px; font-weight: 800; }
    .feature-copy { flex: 1; min-width: 0; }
    .feature-title { display: block; color: #edf2fa; font-size: 11.5px; font-weight: 730; line-height: 1.4; }
    .feature-description { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .feature-open { flex: 0 0 auto; margin-top: 1px; color: #7288aa; font-size: 13px; }
    .page-footnote { margin-top: 17px; padding: 12px 14px; border: 1px solid rgba(124,151,193,.13); border-radius: 12px; background: rgba(255,255,255,.02); color: #8799b3; font-size: 10px; line-height: 1.55; }

    .loading-screen { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: var(--bg); }
    .loading-card { width: min(360px,100%); padding: 28px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); text-align: center; }
    .loading-card img { width: 58px; height: 58px; border-radius: 16px; object-fit: cover; }
    .spinner { width: 22px; height: 22px; margin: 18px auto 0; border: 2px solid #344965; border-top-color: #7ea4ff; border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-card p { margin: 13px 0 0; color: var(--muted); font-size: 11px; }
    .toast {
      position: fixed; z-index: 100; left: 50%; bottom: calc(22px + var(--safe-bottom)); transform: translate(-50%,14px);
      width: max-content; max-width: min(440px,calc(100vw - 30px)); padding: 12px 16px; border: 1px solid #38557f;
      border-radius: 12px; background: #122541; color: #edf3ff; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      font-size: 11px; line-height: 1.45; transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .modal-backdrop { display: none; position: fixed; z-index: 90; inset: 0; align-items: center; justify-content: center; padding: 18px; background: rgba(2,8,18,.72); backdrop-filter: blur(7px); }
    .modal-backdrop.open { display: flex; }
    .modal-card { width: min(490px,100%); max-height: min(82vh,720px); overflow: auto; padding: 22px; border: 1px solid #304766; border-radius: 18px; background: #0e1d35; box-shadow: var(--shadow); }
    .modal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .modal-kicker { color: #9bb7ff; font-size: 9px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
    .modal-title { margin: 7px 0 0; font-size: 19px; letter-spacing: -.4px; }
    .modal-close { display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: #c9d6e8; cursor: pointer; }
    .modal-body { margin-top: 13px; color: #aebdd2; font-size: 11.5px; line-height: 1.7; }
    .modal-note { margin-top: 15px; padding: 12px; border: 1px solid rgba(91,142,255,.2); border-radius: 11px; background: rgba(47,107,255,.08); color: #c2d2f1; font-size: 10.5px; line-height: 1.55; }
    .modal-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
    .permission-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-top: 14px; }
    .permission-item { padding: 11px; border: 1px solid rgba(124,151,193,.17); border-radius: 10px; background: rgba(255,255,255,.025); }
    .permission-item strong { display: block; color: #e4ecfa; font-size: 10.5px; }
    .permission-item span { display: block; margin-top: 4px; color: var(--muted); font-size: 9.5px; line-height: 1.5; }
    .mobile-scrim { display: none; }

    @media (max-width: 1120px) {
      .app-shell { grid-template-columns: 232px minmax(0,1fr); }
      .module-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .welcome-mark { width: 92px; height: 92px; flex-basis: 92px; margin-right: 0; }
      .welcome-mark img { width: 66px; height: 66px; }
    }
    @media (max-width: 820px) {
      body { overflow: hidden; }
      .app-shell { display: block; }

      return String(value ?? "").replace(/[&<>"']/g, (character) => ({

      })[character]);
    }

      return words.slice(0, 2).map((part) => part.charAt(0).toUpperCase()).join("") || "U";
    }

            <div class="eyebrow">Your connected business space</div>
            <h1 class="welcome-title">Welcome back, ${safeName}.</h1>
            <p class="welcome-description">Bring your business identity, customers, conversations and daily operations into one organized workspace. Choose a section to get started.</p>
            <div class="welcome-actions">
              <button class="primary-button" type="button" data-group="identity">Set up business identity <span aria-hidden="true">→</span></button>
              <button class="secondary-button" type="button" data-group="discovery">Explore BusinessOS</button>
            </div>
          </div>
          <div class="welcome-mark" aria-hidden="true"><img src="./logo.png" alt=""></div>
        </section>
        <section class="stats-grid" aria-label="Workspace summary">
          <div class="stat-card"><span class="stat-icon" aria-hidden="true">✦</span><span><strong class="stat-value">110</strong><span class="stat-label">Planned capabilities</span></span></div>
          <div class="stat-card"><span class="stat-icon" aria-hidden="true">▦</span><span><strong class="stat-value">11</strong><span class="stat-label">Organized workspaces</span></span></div>
          <div class="stat-card"><span class="stat-icon" aria-hidden="true">✓</span><span><strong class="stat-value">Active</strong><span class="stat-label">Signed-in session</span></span></div>
        </section>
        <div class="section-heading"><div><h2>Explore your workspaces</h2><p>Each section groups related tools, so your workspace stays clear and easy to navigate.</p></div></div>
        <section class="module-grid" aria-label="BusinessOS modules">${moduleCards}</section>
        <section class="lower-grid">
          <div class="surface-card"><h3>Quick access</h3><p>Jump directly to frequently used areas of the platform.</p>
            <div class="quick-list">
              <button class="quick-button" type="button" data-group="discovery"><span>⌕</span>Discover businesses</button>
              <button class="quick-button" type="button" data-group="messaging"><span>✉</span>Messages</button>
              <button class="quick-button" type="button" data-group="commerce"><span>▣</span>Storefronts</button>
              <button class="quick-button" type="button" data-group="community"><span>↗</span>Advertising centre</button>
            </div>
          </div>
          <div class="surface-card"><h3>Built with care</h3><p>BusinessOS is designed around connected business activity.</p>
            <div class="integrity-line"><span class="integrity-check">✓</span><span>Private account identity and controlled business access.</span></div>
            <div class="integrity-line"><span class="integrity-check">✓</span><span>Responsive layout for mobile, tablet and desktop screens.</span></div>
            <div class="integrity-line"><span class="integrity-check">✓</span><span>Native device capabilities are requested only when needed.</span></div>
          </div>
        </section>
        <div class="page-footnote">The 110 items are the complete BusinessOS product catalogue. Some modules are planned for later development and will become active as their dedicated pages and secure services are implemented.</div>`;
    }

    function renderGroup(groupId) {
      const group = groups.find((item) => item.id === groupId);
      if (!group) return renderOverview();
      activeGroupId = group.id;
      els.contextTitle.textContent = group.shortTitle;
      const firstNumber = group.features[0].number;
      const lastNumber = group.features[group.features.length - 1].number;
      const cards = group.features.map((feature) => `
        <button class="feature-card" type="button" data-feature="${feature.number}" aria-label="Open ${escapeHTML(feature.title)} details">
          <span class="feature-number">${String(feature.number).padStart(2,"0")}</span>
          <span class="feature-copy"><span class="feature-title">${escapeHTML(feature.title)}</span><span class="feature-description">${escapeHTML(feature.description)}</span></span>
          <span class="feature-open" aria-hidden="true">›</span>
        </button>`).join("");
      els.content.innerHTML = `
        <div class="group-header">
          <div><div class="eyebrow">BusinessOS module · ${escapeHTML(group.shortTitle)}</div><h1>${escapeHTML(group.title)}</h1><p>${escapeHTML(group.description)}</p></div>
          <div class="group-count"><strong>10</strong><span>features<br>${firstNumber}–${lastNumber}</span></div>
        </div>
        <section class="feature-grid" aria-label="${escapeHTML(group.title)} features">${cards}</section>
        <div class="page-footnote">This section contains features ${firstNumber}–${lastNumber} of the BusinessOS catalogue. Selecting a feature opens its details. Dedicated feature workflows will be connected as each module is developed.</div>`;
    }

    function selectGroup(groupId) {
      activeGroupId = groupId;
      renderNavigation();
      if (groupId === "overview") renderOverview(); else renderGroup(groupId);
      closeMobileNav();
      els.profileMenu.classList.remove("open");
      els.profileButton.setAttribute("aria-expanded", "false");
      els.results.classList.remove("open");
      els.main.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(title, bodyHTML, kicker = "BusinessOS module") {
      els.modalKicker.textContent = kicker;
      els.modalTitle.textContent = title;
      els.modalBody.innerHTML = bodyHTML;
      els.modal.classList.add("open");
      document.body.style.overflow = "hidden";
      document.getElementById("modalClose").focus();
    }

    function closeModal() {
      els.modal.classList.remove("open");
      document.body.style.overflow = "";
    }

    function showFeature(featureNumber) {
      const feature = allFeatures.find((item) => item.number === Number(featureNumber));
      if (!feature) return;
      if (feature.number === 108) {
        openModal(feature.title, `
          <p>${escapeHTML(feature.description)}</p>
          <div class="permission-list">
            <div class="permission-item"><strong>Location</strong><span>For maps, nearby discovery and location-based business tools.</span></div>
            <div class="permission-item"><strong>Camera</strong><span>For profile photos, product images, documents and video capture.</span></div>
            <div class="permission-item"><strong>Microphone</strong><span>For voice notes, audio/video calls and recording features.</span></div>
            <div class="permission-item"><strong>Photos and files</strong><span>For selecting and uploading permitted images, videos and documents.</span></div>
            <div class="permission-item"><strong>Notifications</strong><span>For messages, order updates, reminders and important account alerts.</span></div>
            <div class="permission-item"><strong>Connected devices</strong><span>For reviewing supported app/device access and trusted sessions.</span></div>
          </div>
          <div class="modal-note">${isNativeBusinessOSApp() ? "This session is running inside a native app container. The relevant Capacitor/native permission plugins still need to be installed and configured before the app can request each operating-system permission." : "This page is currently running in a browser. Native Android/iOS permission prompts will be connected in the APK build through the appropriate native plugins."} BusinessOS will request access only when you use the feature that needs it—not all permissions at sign-in.</div>`, "Settings · Device access");
        return;
      }
      const note = feature.number === 110
        ? `<div class="modal-note">BusinessOS support: <a href="mailto:codeacademysolutions@gmail.com" style="color:#b9cdff">Contact support</a>. Legal documents and app-version details will be linked here as those pages are published.</div>`
        : `<div class="modal-note">This capability is included in the BusinessOS product plan. Its dedicated workflow will be connected as this module is developed.</div>`;
      openModal(feature.title, `<p>${escapeHTML(feature.description)}</p>${note}`, `${feature.groupTitle} · Feature ${feature.number}`);
    }

    function searchFeatures(query) {
      const term = query.trim().toLowerCase();
      if (!term) { els.results.classList.remove("open"); els.results.innerHTML = ""; return; }
      const matches = allFeatures.filter((feature) => `${feature.title} ${feature.description} ${feature.groupTitle}`.toLowerCase().includes(term)).slice(0, 9);
      if (!matches.length) {
        els.results.innerHTML = `<div style="padding:13px;color:#98a9c2;font-size:11px">No matching BusinessOS feature found.</div>`;
      } else {
        els.results.innerHTML = matches.map((feature) => `<button class="search-result" type="button" role="option" data-search-feature="${feature.number}"><span class="result-number">${String(feature.number).padStart(2,"0")}</span><span><span class="result-name">${escapeHTML(feature.title)}</span><span class="result-group">${escapeHTML(feature.groupTitle)}</span></span></button>`).join("");
      }
      els.results.classList.add("open");
    }

    function handleSearchSelection(number) {
      const feature = allFeatures.find((item) => item.number === Number(number));
      if (!feature) return;
      selectGroup(feature.groupId);
      els.search.value = "";
      if (window.matchMedia("(max-width: 600px)").matches) collapseSearch();
      showFeature(feature.number);
    }

    function expandSearch() {
      searchExpanded = true;
      els.searchWrap.classList.add("expanded");
      els.search.focus();
    }

    function collapseSearch() {
      searchExpanded = false;
      els.searchWrap.classList.remove("expanded");
      els.results.classList.remove("open");
    }

    function showSimpleNotice(title, message) {
      openModal(title, `<p>${escapeHTML(message)}</p><div class="modal-note">This workspace area will be connected to its secure BusinessOS service when the relevant module is implemented.</div>`, "BusinessOS");
    }

    async function handleSignOut() {
      const button = document.getElementById("signOutButton");
      button.disabled = true;
      button.textContent = "Signing out…";
      try {
        await signOutBusinessOS();
        window.location.replace("login.html");
      } catch (error) {
        showToast(error?.message || "Sign out could not be completed. Please try again.");
        button.disabled = false;
        button.textContent = "↪  Sign out";
      }
    }

    function handleClick(event) {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.home === "true") return selectGroup("overview");
      if (target.dataset.group) return selectGroup(target.dataset.group);
      if (target.dataset.feature) return showFeature(target.dataset.feature);
      if (target.dataset.searchFeature) return handleSearchSelection(target.dataset.searchFeature);
      if (target.dataset.openSettings === "true") return selectGroup("settings");
      if (target.dataset.openIdentity === "true") return selectGroup("identity");
    }

    els.nav.addEventListener("click", handleClick);
    els.content.addEventListener("click", handleClick);
    els.results.addEventListener("click", handleClick);
    els.mobileMenu.addEventListener("click", () => els.sidebar.classList.contains("open") ? closeMobileNav() : openMobileNav());
    els.scrim.addEventListener("click", closeMobileNav);
    els.profileButton.addEventListener("click", () => {
      const isOpen = els.profileMenu.classList.toggle("open");
      els.profileButton.setAttribute("aria-expanded", String(isOpen));
    });
    els.profileMenu.addEventListener("click", handleClick);
    document.getElementById("signOutButton").addEventListener("click", handleSignOut);
    document.getElementById("notificationButton").addEventListener("click", () => showSimpleNotice("Notifications", "Your BusinessOS notifications will appear here. Message, order, payment, review and account alerts will be connected as their modules are enabled."));
    els.search.addEventListener("input", () => searchFeatures(els.search.value));
    els.search.addEventListener("focus", () => { if (window.matchMedia("(max-width: 600px)").matches && !searchExpanded) expandSearch(); });
    els.search.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { els.search.value = ""; collapseSearch(); els.search.blur(); }
      if (event.key === "Enter") {
        const first = els.results.querySelector("[data-search-feature]");
        if (first) handleSearchSelection(first.dataset.searchFeature);
      }
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".search-wrap")) {
        els.results.classList.remove("open");
        if (window.matchMedia("(max-width: 600px)").matches && !els.search.value) collapseSearch();
      }
      if (!event.target.closest(".profile-wrap")) {
        els.profileMenu.classList.remove("open");
        els.profileButton.setAttribute("aria-expanded", "false");
      }
    });
    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("modalDone").addEventListener("click", closeModal);
    els.modal.addEventListener("click", (event) => { if (event.target === els.modal) closeModal(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") { closeModal(); closeMobileNav(); } });

    async function startWorkspace() {
      try {
        els.loadingMessage.textContent = "Checking your signed-in account…";
        const user = await requireVerifiedUser({ redirectTo: "login.html?verification=pending" });
        if (!user) return;
        currentUser = user;
        try {
          currentProfile = await getUserProfile(user.uid);
        } catch (profileError) {
          console.warn("BusinessOS profile details could not be loaded; showing Firebase account information.", profileError);
          currentProfile = null;
        }
        setUserDetails(currentUser, currentProfile);
        renderNavigation();
        renderOverview();
        els.loading.hidden = true;
        els.app.hidden = false;
        els.main.focus({ preventScroll: true });
        authUnsubscribe = await observeAuthState((updatedUser) => {
          if (!updatedUser) window.location.replace("login.html");
        });
      } catch (error) {
        console.error("BusinessOS workspace could not start:", error);
        els.loadingMessage.textContent = error?.message || "We could not open your workspace. Please sign in again.";
        showToast("Workspace connection failed. Check your connection and sign in again.");
      }
    }

    window.addEventListener("beforeunload", () => {
      if (typeof authUnsubscribe === "function") authUnsubscribe();
    });

    void startWorkspace();
  </script>
</body>
</html>
