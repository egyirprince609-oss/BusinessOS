name: BusinessOS Static HTML Deployment

on:
  push:
    branches:
      - "main"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: businessos-pages
  cancel-in-progress: true

jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Get BusinessOS source files
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload actual website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish BusinessOS
        id: deployment
        uses: actions/deploy-pages@v4

